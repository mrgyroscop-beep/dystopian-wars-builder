name: Preview lifecycle

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-lifecycle-${{ github.event.pull_request.number || 'janitor' }}
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview

    steps:
      - name: Check out protected lifecycle controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked trusted lifecycle controller
        run: npm ci --ignore-scripts

      - name: Delete exactly the closed PR preview
        if: github.event_name == 'pull_request_target'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/preview/cleanup.mjs close "${{ github.event.pull_request.number }}"

      - name: Delete only allowlisted previews older than seven days
        if: github.event_name != 'pull_request_target'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/preview/cleanup.mjs janitor
