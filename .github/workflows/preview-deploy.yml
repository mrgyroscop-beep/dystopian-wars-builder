name: Preview deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: preview-pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview

    steps:
      - name: Check out protected deployment controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked trusted deployment controller
        run: npm ci --ignore-scripts

      - name: Revalidate trusted run and unchanged PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/preview
          node scripts/preview/resolve-trusted-run.mjs artifacts/preview/trusted-event.json

      - name: Download exact inert artifact from Required CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-bundle-${{ github.event.workflow_run.head_sha }}
          path: artifacts/preview/current/package
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify exact artifact before credentials are exposed
        run: >-
          npm run preview:verify --
          artifacts/preview/current/package
          artifacts/preview/trusted-event.json

      - name: Locate retained last-known-good preview
        id: previous
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/preview/find-last-good.mjs "${{ github.event.workflow_run.pull_requests[0].number }}"

      - name: Download retained last-known-good preview
        if: steps.previous.outputs.found == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-last-good-pr-${{ github.event.workflow_run.pull_requests[0].number }}
          path: artifacts/preview/previous/package
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Upload immutable version, smoke, promote alias and smoke again
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/preview/deploy.mjs
          artifacts/preview/current/package
          artifacts/preview/trusted-event.json
          ${{ steps.previous.outputs.found == 'true' && 'artifacts/preview/previous/package' || '' }}

      - name: Retain verified last-known-good package for rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-last-good-pr-${{ github.event.workflow_run.pull_requests[0].number }}
          path: artifacts/preview/current/package/
          if-no-files-found: error
          retention-days: 7

      - name: Publish redacted deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-evidence-${{ github.event.workflow_run.head_sha }}
          path: artifacts/preview/deployment-report.json
          if-no-files-found: error
          retention-days: 7
